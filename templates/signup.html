<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#f1f5f9;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
}

.container{
width:100%;
max-width:1000px;
height:88vh;
background:white;
border-radius:24px;
display:grid;
grid-template-columns:1fr 1fr;
overflow:hidden;
box-shadow:0 10px 40px rgba(0,0,0,0.08);
}

.left{
background:#2563eb;
color:white;
padding:50px;
display:flex;
flex-direction:column;
justify-content:center;
}

.left h1{
font-size:46px;
line-height:1.1;
margin-bottom:20px;
}

.left p{
font-size:15px;
line-height:1.7;
margin-bottom:30px;
}
.left img{
    width:88%;
    height:200px;
    object-fit:cover;
    border-radius:0;
    margin-top:18px;
    display:block;
}

.right{
padding:60px;
display:flex;
flex-direction:column;
justify-content:center;
}

.logo{
font-size:30px;
font-weight:700;
margin-bottom:35px;
}

.logo span{
color:#2563eb;
}

h2{
font-size:34px;
margin-bottom:12px;
}

.subtitle{
color:#64748b;
margin-bottom:30px;
font-size:14px;
}

label{
display:block;
margin-bottom:8px;
font-size:14px;
font-weight:600;
}

input{
width:100%;
padding:14px;
border:1px solid #cbd5e1;
border-radius:12px;
margin-bottom:18px;
font-size:14px;
outline:none;
}

input:focus{
border-color:#2563eb;
}

button{
width:100%;
padding:14px;
background:#2563eb;
border:none;
border-radius:12px;
color:white;
font-size:15px;
font-weight:600;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#1d4ed8;
}

.bottom{
text-align:center;
margin-top:22px;
font-size:14px;
color:#64748b;
}

.bottom a{
color:#2563eb;
text-decoration:none;
font-weight:600;
}

</style>
</head>

<body>

<div class="container">

<div class="left">

<h1>Create Your Dashboard Account</h1>

<p>
Signup to upload datasets, run clustering algorithms and visualize customer analytics instantly.
</p>

<img src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=1200&auto=format&fit=crop">

</div>

<div class="right">

<div class="logo">
Customer <span>Segmentation</span>
</div>

<h2>Signup</h2>

<p class="subtitle">
Create your account to continue.
</p>

<form method="POST">

<label>Username</label>

<input type="text"
name="username"
placeholder="Create username"
required>

<label>Password</label>

<input type="password"
name="password"
placeholder="Create password"
required>

<button type="submit">
Create Account
</button>

</form>

<div class="bottom">
Already have an account?
<a href="/login">Login</a>
</div>

</div>

</div>

</body>
</html>
